name: Update profile

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      # ─────────────────────────────────────
      # GitHub statistics card
      # ─────────────────────────────────────

      - name: Generate stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=sunraylain
            &show_icons=true
            &hide_title=true
            &hide_rank=true
            &include_all_commits=true
            &bg_color=0D1117
            &title_color=D8D1C5
            &text_color=B7C0C8
            &icon_color=8FAEA6
            &border_color=202830
            &border_radius=6
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────
      # Detailed profile statistics
      # ─────────────────────────────────────

      - name: Generate profile statistics
        uses: cicirello/user-statistician@v1
        with:
          image-file: profile/profile-stats.svg
          include-title: false

          colors: "#0D1117 #202830 #8FAEA6 #D8D1C5 #B7C0C8"

          max-languages: 6
          animated-language-chart: false

          image-width: 470

          category-order: repositories, contributions, languages

          hide-keys: >-
            general
            starredBy
            forkedBy
            watchedBy
            templates
            archived
            private

          border-radius: 6
          show-border: true
          top-icon: none
          locale: en
          commit-and-push: false

      # ─────────────────────────────────────
      # Activity / habits
      # ─────────────────────────────────────

      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}

          base: header
          output_action: none

          config_output: svg
          config_display: large
          config_timezone: Europe/London

          config_order: >-
            base.header,
            isocalendar,
            languages,
            habits

          # Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Language distribution
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_threshold: 1%
          plugin_languages_details: percentage
          plugin_languages_other: yes

          plugin_languages_colors: >-
            8FAEA6,
            7F9FBC,
            D8D1C5,
            6F7D87,
            9AA6AE,
            73848D

          # Recent coding habits
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: no
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_trim: yes

          plugin_habits_languages_limit: 3
          plugin_habits_languages_threshold: 1%

          extras_css: |
            svg {
              background: #0D1117 !important;
            }

            h1,
            h2,
            h3 {
              color: #D8D1C5 !important;
              font-family: monospace !important;
            }

            .text {
              color: #D8D1C5 !important;
            }

            .text-muted {
              color: #6F7D87 !important;
            }

            .field {
              color: #B7C0C8 !important;
            }

      # ─────────────────────────────────────
      # Move metrics into profile directory
      # ─────────────────────────────────────

      - name: Move metrics
        run: |
          mkdir -p profile
          cp /metrics_renders/metrics.svg profile/metrics.svg

      # ─────────────────────────────────────
      # Commit everything
      # ─────────────────────────────────────

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "update profile cards"
            git push
          fi