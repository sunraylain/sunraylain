name: Update profile

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: profile-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ─────────────────────────────────────
      # Main statistics card
      # ─────────────────────────────────────

        - name: Generate profile statistics
          uses: cicirello/user-statistician@v1
          with:
            image-file: profile/profile-stats.svg
            include-title: false
            colors: "#0D1117 #202830 #8FAEA6 #D8D1C5 #B7C0C8"
            max-languages: 6
            animated-language-chart: false
            image-width: 470
            category-order: repositories, contributions, languages
            hide-keys: >-
              general,
              starredBy,
              forkedBy,
              watchedBy,
              templates,
              archived,
              private
            top-icon: none
            border-radius: 0
            show-border: false
            locale: en
            commit-and-push: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────
      # Commit generated profile statistics
      # ─────────────────────────────────────

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "update profile cards"

          git pull --rebase origin main

          git push origin main