name: Update profile

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      # ─────────────────────────────────────────────
      # GitHub statistics
      # ─────────────────────────────────────────────

      - name: Generate stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=sunraylain
            &show_icons=true
            &hide_title=true
            &hide_rank=true
            &include_all_commits=true
            &bg_color=0D1117
            &title_color=D8D1C5
            &text_color=B7C0C8
            &icon_color=8FAEA6
            &border_color=30363D
            &border_radius=4
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────────
      # Top languages
      # ─────────────────────────────────────────────

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=sunraylain
            &layout=compact
            &langs_count=6
            &hide_title=true
            &bg_color=0D1117
            &title_color=D8D1C5
            &text_color=B7C0C8
            &border_color=30363D
            &border_radius=4
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────────
      # Metrics
      # ─────────────────────────────────────────────

      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg

          token: ${{ secrets.GITHUB_TOKEN }}

          base: header

          output_action: none
          config_output: svg
          config_display: large

          config_timezone: Europe/London

          config_order: >-
            base.header,
            isocalendar,
            languages,
            activity,
            repositories

          # Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Languages
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_threshold: 1%
          plugin_languages_details: percentage
          plugin_languages_other: yes

          plugin_languages_colors: >-
            8FAEA6,
            7F9FBC,
            D8D1C5,
            6F7D87,
            9AA6AE,
            73848D

          # Activity
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 30
          plugin_activity_timestamps: yes

          # Repositories
          plugin_repositories: yes
          plugin_repositories_pinned: 3

          # Custom appearance
          extras_css: |
            svg {
              background: #0D1117 !important;
            }

            h1,
            h2,
            h3 {
              color: #D8D1C5 !important;
              font-family: monospace !important;
            }

            .text {
              color: #D8D1C5 !important;
            }

            .text-muted {
              color: #6F7D87 !important;
            }

            .field {
              color: #B7C0C8 !important;
            }

      # ─────────────────────────────────────────────
      # Move generated metrics
      # ─────────────────────────────────────────────

      - name: Move metrics
        run: |
          mkdir -p profile
          cp /metrics_renders/metrics.svg profile/metrics.svg

      # ─────────────────────────────────────────────
      # Commit everything
      # ─────────────────────────────────────────────

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "update profile cards"
          git push