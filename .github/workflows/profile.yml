name: Update profile

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=sunraylain&show_icons=true&hide_title=true&hide_rank=true&include_all_commits=true&bg_color=0D1117&title_color=D8D1C5&text_color=B7C0C8&icon_color=8FAEA6&border_color=30363D&border_radius=4
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=sunraylain&layout=compact&langs_count=6&hide_title=true&bg_color=0D1117&title_color=D8D1C5&text_color=B7C0C8&border_color=30363D&border_radius=4
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          filename: profile/metrics.svg

          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          base: header
          config_output: svg
          config_display: large
          config_timezone: Europe/London

          config_order: >-
            base.header,
            isocalendar,
            languages,
            activity,
            repositories

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_threshold: 1%
          plugin_languages_details: percentage
          plugin_languages_other: yes

          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 30
          plugin_activity_timestamps: yes

          plugin_repositories: yes
          plugin_repositories_pinned: 3

          extras_css: |
            svg {
              background: #0D1117 !important;
            }

            h1, h2, h3 {
              color: #D8D1C5 !important;
              font-family: monospace !important;
            }

            .text {
              color: #D8D1C5 !important;
            }

            .text-muted {
              color: #6F7D87 !important;
            }

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git diff --cached --quiet || \
            git commit -m "update profile cards"

          git push