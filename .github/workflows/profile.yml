name: Update profile

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: cicirello/user-statistician@v1
        with:
          image-file: profile/profile-stats.svg
          include-title: false
          colors: "#0D1117 #202830 #8FAEA6 #D8D1C5 #B7C0C8"
          max-languages: 6
          animated-language-chart: false
          image-width: 470
          category-order: repositories, contributions, languages
          hide-keys: >-
            general,
            starredBy,
            forkedBy,
            watchedBy,
            templates,
            archived,
            private
          top-icon: none
          border-radius: 0
          show-border: false
          locale: en
          commit-and-push: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}