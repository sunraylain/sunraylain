name: Update profile

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate stats
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          path: profile/profile-stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          options: 'username=${{ github.repository_owner }}&theme=noctis_minimus&show_icons=true&hide_border=true&border_radius=0&locale=en'

      - name: Generate languages
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          path: profile/profile-languages.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          options: 'username=${{ github.repository_owner }}&theme=noctis_minimus&layout=normal&langs_count=6&hide_border=true&border_radius=0&locale=en'

      - name: Commit statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/profile-stats.svg profile/profile-languages.svg
          git diff --cached --quiet && exit 0
          git commit -m "update profile statistics"
          git push