      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}

          base: header
          output_action: none
          config_output: svg
          config_display: large
          config_timezone: Europe/London

          config_order: >-
            base.header,
            habits

          # ───────────────────────────────
          # Recent coding habits
          # ───────────────────────────────

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: no

          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_trim: yes

          plugin_habits_languages_limit: 3
          plugin_habits_languages_threshold: 1%

          # ───────────────────────────────
          # Custom palette
          # ───────────────────────────────

          extras_css: |
            svg {
              background: #0D1117 !important;
            }

            h1,
            h2,
            h3 {
              color: #D8D1C5 !important;
              font-family: monospace !important;
            }

            text {
              fill: #B7C0C8 !important;
            }

            .text {
              color: #B7C0C8 !important;
              fill: #B7C0C8 !important;
            }

            .text-muted {
              color: #6F7D87 !important;
              fill: #6F7D87 !important;
            }

            .field {
              color: #B7C0C8 !important;
              fill: #B7C0C8 !important;
            }

            .title {
              color: #D8D1C5 !important;
              fill: #D8D1C5 !important;
            }

            rect,
            path,
            circle {
              stroke: #202830 !important;
            }