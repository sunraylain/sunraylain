name: Update profile metrics

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest

        with:
          filename: profile/metrics.svg

          token: ${{ secrets.GITHUB_TOKEN }}

          user: sunraylain

          # ─────────────────────────────────────
          # General
          # ─────────────────────────────────────

          base: header
          config_timezone: Europe/London
          config_output: svg
          config_base64: yes

          config_order: >-
            base.header,
            isocalendar,
            languages,
            activity,
            repositories

          # ─────────────────────────────────────
          # Commit calendar
          # ─────────────────────────────────────

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # ─────────────────────────────────────
          # Languages
          # ─────────────────────────────────────

          plugin_languages: yes

          plugin_languages_limit: 5

          plugin_languages_threshold: 1%

          plugin_languages_details: percentage

          plugin_languages_other: yes

          plugin_languages_colors: >-
            8FAEA6,
            7F9FBC,
            B7AFA3,
            65747E,
            596B68

          # ─────────────────────────────────────
          # Activity
          # ─────────────────────────────────────

          plugin_activity: yes

          plugin_activity_limit: 5

          plugin_activity_load: 300

          plugin_activity_days: 30

          plugin_activity_timestamps: yes

          # ─────────────────────────────────────
          # Repositories
          # ─────────────────────────────────────

          plugin_repositories: yes

          plugin_repositories_pinned: 3

          # ─────────────────────────────────────
          # Visual style
          # ─────────────────────────────────────

          extras_css: |
            :root {
              --color-background: #0D1117;
              --color-text: #D8D1C5;
              --color-muted: #6F7D87;
              --color-accent: #8FAEA6;
              --color-blue: #7F9FBC;
            }

            svg {
              background: #0D1117 !important;
            }

            h1, h2, h3 {
              color: #D8D1C5 !important;
              font-family: monospace !important;
            }

            .text {
              color: #D8D1C5 !important;
            }

            .text-muted {
              color: #6F7D87 !important;
            }

            .color-bg-default {
              background: #0D1117 !important;
            }

            .color-accent {
              color: #8FAEA6 !important;
            }

          # ─────────────────────────────────────
          # Commit generated SVG
          # ─────────────────────────────────────

          output_action: commit

          committer_branch: main

          committer_message: "update profile metrics"